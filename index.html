<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR with Pause</title>

  <!-- AR.js and A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Optional: Gesture support -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend/src/modules/marker/tools/gesture-handler.js"></script>

  <style>
    #pauseBtn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    #pauseBtn:active {
      background: rgba(255, 140, 0, 0.9);
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- AR Scene -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
    renderer="logarithmicDepthBuffer: true;"
    gesture-detector
  >
    <a-assets>
      <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
    </a-assets>

    <a-marker
      id="marker"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
    >
      <a-entity
        id="model"
        gltf-model="#animated-asset"
        animation-mixer="loop: repeat"
        scale="0.21 0.21 0.21"
        gesture-handler
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Pause Button -->
  <button id="pauseBtn">Pause Animation</button>

  <script>
    const model = document.querySelector('#model');
    const btn = document.querySelector('#pauseBtn');

    let isPaused = false;

    btn.addEventListener('click', () => {
      isPaused = !isPaused;
      model.setAttribute('animation-mixer', 'paused', isPaused);
      btn.textContent = isPaused ? 'Play Animation' : 'Pause Animation';
    });

    // Fix for iOS: force reflow to draw button
    window.addEventListener('load', () => {
      setTimeout(() => {
        btn.style.display = 'block';
      }, 500);
    });
  </script>
</body>
</html>
