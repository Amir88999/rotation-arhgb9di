<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Viewer with Pause</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      .ui-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        z-index: 9999;
        cursor: pointer;
      }

      /* Ensure button displays on iOS */
      @media (orientation: portrait), (orientation: landscape) {
        .ui-button { display: block; }
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false"
    >
      <a-assets>
        <a-asset-item id="karakuriModel" src="assets/asset.glb"></a-asset-item>
      </a-assets>

      <a-marker
        preset="custom"
        type="pattern"
        url="assets/marker.patt"
      >
        <a-entity
          id="karakuri"
          gltf-model="#karakuriModel"
          animation-mixer="clip: *; loop: repeat"
          scale="0.21 0.21 0.21"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- Pause/Play Button -->
    <button class="ui-button" id="pauseBtn">Pause Animation</button>

    <script>
      const model = document.querySelector('#karakuri');
      const button = document.querySelector('#pauseBtn');
      let isPaused = false;

      button.addEventListener('click', () => {
        const mixer = model.components['animation-mixer'];
        if (mixer) {
          mixer.pause(!isPaused);
          isPaused = !isPaused;
          button.textContent = isPaused ? 'Play Animation' : 'Pause Animation';
        }
      });
    </script>
  </body>
</html>
