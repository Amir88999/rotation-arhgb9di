<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Viewer with Pause & Gesture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- Scripts -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      .ui-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        z-index: 9999;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="model" src="assets/asset.glb"></a-asset-item>
      </a-assets>

      <a-marker
        preset="custom"
        type="pattern"
        url="assets/marker.patt"
      >
        <a-entity
          id="modelEntity"
          gltf-model="#model"
          scale="0.21 0.21 0.21"
          animation-mixer
          gesture-handler
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <button class="ui-button" id="toggleBtn">Pause Animation</button>

    <script>
      const btn = document.getElementById("toggleBtn");
      const model = document.getElementById("modelEntity");
      let isPaused = false;

      btn.addEventListener("click", () => {
        const mixer = model.components["animation-mixer"];
        if (mixer && mixer.mixer) {
          if (isPaused) {
            mixer.mixer.timeScale = 1;
            btn.textContent = "Pause Animation";
          } else {
            mixer.mixer.timeScale = 0;
            btn.textContent = "Play Animation";
          }
          isPaused = !isPaused;
        }
      });
    </script>
  </body>
</html>
